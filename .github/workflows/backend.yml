name: Backend

# Runs what the deploy runs. `medusa build` generates .medusa/types, then lints
# and type-checks the backend source before compiling, so a type error fails
# here rather than in Render's build log.
#
# Deliberately NOT a standalone `tsc --noEmit` step:
#   - .medusa/types is gitignored and only exists after a build, so type-checking
#     first reports errors (query.graph results degrade to `unknown`) that no one
#     sees locally;
#   - the root tsconfig sweeps in src/admin, which Vite compiles separately as
#     ESM with its own tsconfig, producing CommonJS errors the real build never hits.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build backend (generates types, lints, type-checks, compiles)
        working-directory: apps/backend
        run: pnpm run build
