name: Backend

# Runs what the deploy runs. `medusa build` generates .medusa/types, then lints
# and type-checks the backend source before compiling, so a type error fails
# here rather than in Render's build log.
#
# Deliberately NOT a standalone `tsc --noEmit` step:
#   - .medusa/types is gitignored and only exists after a build, so type-checking
#     first reports errors (query.graph results degrade to `unknown`) that no one
#     sees locally;
#   - the root tsconfig sweeps in src/admin, which Vite compiles separately as
#     ESM with its own tsconfig, producing CommonJS errors the real build never hits.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medusa_test
          POSTGRES_PASSWORD: migration_test_only
          POSTGRES_DB: medusa_migration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medusa_test -d medusa_migration_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Backend regression tests
        working-directory: apps/backend
        run: pnpm run test:unit

      - name: Build backend (generates types, lints, type-checks, compiles)
        working-directory: apps/backend
        run: pnpm run build

      - name: Fresh database migrations and repeat-run smoke test
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://medusa_test:migration_test_only@localhost:5432/medusa_migration_test
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:9000
          JWT_SECRET: migration_test_jwt_secret_not_for_production
          COOKIE_SECRET: migration_test_cookie_secret_not_for_production
          RESEND_API_KEY: re_migration_test
          EMAIL_DELIVERY_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          RESEND_FROM_EMAIL: test@example.com
          CREDO_PUBLIC_KEY: migration_test
          CREDO_SECRET_KEY: migration_test
          PAYSTACK_SECRET_KEY: sk_test_migration
          S3_FILE_URL: https://example.com
          S3_BUCKET: migration-test
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: migration_test
          S3_SECRET_ACCESS_KEY: migration_test
        run: |
          pnpm exec medusa db:migrate --skip-scripts
          pnpm exec medusa db:migrate --skip-scripts

      - name: Security HTTP and database integration tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://medusa_test:migration_test_only@localhost:5432/medusa_migration_test
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:9000
          JWT_SECRET: migration_test_jwt_secret_not_for_production
          COOKIE_SECRET: migration_test_cookie_secret_not_for_production
          RESEND_API_KEY: re_migration_test
          EMAIL_DELIVERY_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          RESEND_FROM_EMAIL: test@example.com
          CREDO_PUBLIC_KEY: migration_test
          CREDO_SECRET_KEY: migration_test
          PAYSTACK_SECRET_KEY: sk_test_migration
          S3_FILE_URL: https://example.com
          S3_BUCKET: migration-test
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: migration_test
          S3_SECRET_ACCESS_KEY: migration_test
          NODE_ENV: test
          MEDUSA_TEST_DB_ISOLATED: "1"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: medusa_test
          DB_PASSWORD: migration_test_only
        run: pnpm run test:integration:http

  # Only after the job above has linted, type-checked, built and migrated a
  # throwaway database, so a red build never reaches the server.
  image:
    name: Build and push the image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  admin:
    name: Build and deploy the dashboard
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MEDUSA_BACKEND_URL is compiled into the bundle, so it has to be set
      # here rather than on the host that serves it.
      - name: Build the dashboard
        working-directory: apps/backend
        env:
          ADMIN_DISABLED: "true"
          MEDUSA_BACKEND_URL: ${{ vars.MEDUSA_BACKEND_URL }}
          STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
        run: pnpm run build:admin

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/backend/deploy/admin/wrangler.jsonc

  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    concurrency:
      group: backend-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Sync the compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/backend/deploy/docker-compose.yml
          target: /opt/youjaymharah
          strip_components: 3

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY_USER,REGISTRY_TOKEN,BACKEND_IMAGE,SENTRY_RELEASE
          script: |
            set -e
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            cd /opt/youjaymharah
            export BACKEND_IMAGE SENTRY_RELEASE
            docker compose pull
            docker compose up -d --wait --wait-timeout 300
            docker image prune -f
            docker logout ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          SENTRY_RELEASE: ${{ github.sha }}
