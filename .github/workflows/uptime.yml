name: Uptime

# A cheap backstop, not a monitoring service: GitHub delays scheduled runs under
# load and disables them after 60 days without repository activity. Pair it with
# an external monitor.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: Probe the API
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Probe
        id: probe
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL is not set; nothing to probe."
            exit 0
          fi

          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 --retry 2 --retry-delay 5 "$HEALTH_URL" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" != "200" ]; then
            echo "Health check returned $code"
            head -c 500 /tmp/body || true
            exit 1
          fi

          echo "Healthy."

      - name: Raise an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime: the API health check is failing"
            const body = `\`${{ vars.HEALTH_URL }}\` returned \`${{ steps.probe.outputs.status || 'no response' }}\`.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "uptime",
            })

            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              })
              return
            }

            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ["uptime"],
            })
