services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: youjaymharah-backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: "9000"
      # Ties an error in Sentry to the deploy that introduced it.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # 1 GB instance: cap the heap so a spike swaps instead of being OOM-killed.
      NODE_OPTIONS: --max-old-space-size=768
    # Loopback only; TLS and the public name belong to whatever fronts this
    # (a Cloudflare tunnel, Caddy, nginx).
    ports:
      - "127.0.0.1:9000:9000"
    # A 30 GB disk fills quietly without this.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
